<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <title>Notes App</title>
  <link rel="shortcut icon" href="./icon.png" type="image/x-icon"/>
  <link rel="stylesheet" href="styles.css"/>

  <script src="./script/modules/dataManager.js"></script>
  <script src="./script/modules/uiManager.js"></script>
  <script src="./script/modules/modalManager.js"></script>
  <script src="./script/modules/eventManager.js"></script>
  <script src="./script/notes.js"></script>
</head>

<body>
  <div class="app-container">
    <header class="header">
      <div class="search-container">
        <input type="text" id="search-input" placeholder=" ⌕ Поиск по заметкам..." class="search-input">
      </div>
      <div class="header-actions">
        <button id="export-btn" class="theme-toggle" title="Выгрузить данные">↑</button>
        <button id="import-btn" class="theme-toggle" title="Загрузить данные">↓</button>
        <button id="settings-btn" class="theme-toggle" title="Настройки">⚙️</button>
        <button id="add-note-btn" class="btn btn-primary">✚ Заметка</button>
      </div>
    </header>

    <main class="main-content">
      <section class="notes-list-section">
        <div class="notes-list" id="notes-list">
        </div>
      </section>

      <section class="note-details-section">
        <div class="note-details" id="note-details">
          <div class="note-details-placeholder">
            <p>Выберите заметку для просмотра</p>
          </div>
        </div>
      </section>
    </main>
  </div>
  <div id="note-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modal-title">Новая заметка</h3>
        <button id="close-modal" class="close-btn">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label for="note-title">Название:</label>
          <input type="text" id="note-title" class="form-input" placeholder="Введите название заметки">
        </div>
        <div class="form-group">
          <label for="note-login">Логин (опционально):</label>
          <input type="text" id="note-login" class="form-input" placeholder="Введите логин">
        </div>
        <div class="form-group">
          <label for="note-password">Пароль (опционально):</label>
          <div class="password-input-container">
            <input type="password" id="note-password" class="form-input" placeholder="Введите пароль">
            <button type="button" id="toggle-password" class="password-toggle">👁️</button>
          </div>
        </div>
        <div class="form-group">
          <label for="note-content">Содержимое:</label>
          <textarea id="note-content" class="form-textarea" placeholder="Введите содержимое заметки"></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button id="save-note" class="btn btn-primary">Сохранить</button>
        <button id="cancel-note" class="btn btn-secondary">Отмена</button>
      </div>
    </div>
  </div>

  <div id="settings-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Настройки</h3>
        <button id="close-settings-modal" class="close-btn">&times;</button>
      </div>
      <div class="modal-body">
        <div class="settings-section">
          <h4 class="settings-section-title">Оформление</h4>
          <div class="form-group">
            <label for="theme-select">Тема:</label>
            <select id="theme-select" class="form-input">
              <option value="light">Светлая</option>
              <option value="dark">Темная</option>
            </select>
          </div>
        </div>

        <div class="settings-section">
          <h4 class="settings-section-title">Управление данными</h4>
          
          <div class="form-group">
            <label>Экспорт данных:</label>
            <div class="export-import-controls">
              <button id="export-excel-btn" class="btn btn-secondary">
                📊 Экспорт в Excel
              </button>
              <p class="help-text">Сохранить все заметки в Excel файл</p>
            </div>
          </div>

          <div class="form-group">
            <label>Импорт данных:</label>
            <div class="export-import-controls">
              <input type="file" id="import-excel-input" accept=".xlsx,.xls" style="display: none;">
              <button id="import-excel-btn" class="btn btn-secondary">
                📥 Импорт из Excel
              </button>
              <p class="help-text">Загрузить заметки из Excel файла</p>
            </div>
          </div>

          <div class="form-group">
            <label>Резервное копирование:</label>
            <div class="export-import-controls">
              <button id="backup-data-btn" class="btn btn-warning">
                💾 Создать резервную копию
              </button>
              <input type="file" id="restore-backup-input" accept=".json" style="display: none;">
              <button id="restore-backup-btn" class="btn btn-warning">
                🔄 Восстановить из копии
              </button>
              <p class="help-text">JSON резервные копии для точного восстановления</p>
            </div>
          </div>
        </div>

        <div class="settings-section">
          <h4 class="settings-section-title">Статистика</h4>
          <div class="stats-grid">
            <div class="stat-item">
              <span class="stat-label">Всего заметок:</span>
              <span id="total-notes-count" class="stat-value">0</span>
            </div>
            <div class="stat-item">
              <span class="stat-label">С паролями:</span>
              <span id="password-notes-count" class="stat-value">0</span>
            </div>
            <div class="stat-item">
              <span class="stat-label">Избранные:</span>
              <span id="favorite-notes-count" class="stat-value">0</span>
            </div>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button id="close-settings" class="btn btn-secondary">Закрыть</button>
      </div>
    </div>
  </div>
</body>
</html>
